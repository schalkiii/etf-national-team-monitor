name: Deploy report to Pages

# 备用部署通道（手动触发）。日常部署由 daily-update.yml 定时链自动完成,
# 此处仅作 Pages 故障时的手工恢复入口。
# 注：移除 schedule/push 触发,避免与 daily-update.yml 双重部署竞态。
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          test -f site/index.html || { echo "::error::site/index.html missing"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
